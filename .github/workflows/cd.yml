# 도커 이미지를 만들어 GitHub Container Registry에 올린다. 포트폴리오 프로젝트라 운영 배포는 하지 않으며,
# 필요할 때만 직접 실행한다. docs/deployment.md 참고.
name: CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    # latest를 덮어쓰므로 main에서만 실행한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/raon-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/raon-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
