version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 도구용 TypeScript는 6에 고정한다. 타입 검사는 별칭 패키지 typescript-7로 돌린다.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # 프로젝트 기준 Node 버전(.node-version)에 맞춘다.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # React는 19.2로 지정된 프로젝트다. 19.2의 패치만 받는다.
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-major, version-update:semver-minor]
      # stylelint-config-standard-scss가 18을 지원할 때 함께 올린다(17.0.0은 stylelint ^17만 지원).
      - dependency-name: stylelint
        update-types: [version-update:semver-major]
      # postgres 4는 드라이버를 새로 썼고 CI는 PGlite로만 돈다. 실제 PostgreSQL로 확인한 뒤 올린다.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
